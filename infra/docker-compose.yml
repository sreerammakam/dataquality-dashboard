version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: dq_postgres
    environment:
      POSTGRES_USER: dq_user
      POSTGRES_PASSWORD: dq_password
      POSTGRES_DB: dq_db
    ports:
      - "5432:5432"
    volumes:
      - dq_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq_user -d dq_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dq_pgdata:
EOF
